<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>歌词字音&音乐旋律校对</title>
    <style>
      :root {
        --bg: #f4f6fb;
        --panel: #ffffff;
        --border: #d8deea;
        --text: #1f2a37;
        --muted: #5f6b7a;
        --primary: #2357ff;
        --primary-hover: #1b49d6;
        --ok: #0f9d58;
        --err: #d93025;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 20px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei",
          sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      .container {
        max-width: 1500px;
        margin: 0 auto;
      }

      h1 {
        margin: 0;
        font-size: 24px;
      }

      .subtitle {
        color: var(--muted);
        font-size: 14px;
      }

      .subhead-row {
        margin-top: 8px;
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
      }

      .status {
        font-size: 14px;
        text-align: right;
      }

      .status.ok {
        color: var(--ok);
      }

      .status.err {
        color: var(--err);
      }

      .toolbar {
        margin-top: 14px;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
      }

      .top-actions {
        margin-top: 14px;
        display: grid;
        grid-template-columns: 340px minmax(0, 1fr);
        gap: 12px;
        align-items: start;
      }

      .action-stack {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      button,
      select,
      input[type="file"] {
        font-size: 14px;
      }

      button {
        border: none;
        border-radius: 8px;
        padding: 8px 12px;
        cursor: pointer;
      }

      .primary {
        background: var(--primary);
        color: #fff;
      }

      .primary:hover {
        background: var(--primary-hover);
      }

      .secondary {
        background: #e8edf8;
        color: #1f2a37;
      }

      .secondary:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .label {
        display: inline-flex;
        gap: 6px;
        align-items: center;
        color: var(--muted);
      }

      .grid {
        margin-top: 14px;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .content-row {
        margin-top: 14px;
        display: grid;
        grid-template-columns: 320px minmax(0, 1fr) minmax(0, 1fr);
        gap: 12px;
        align-items: start;
      }

      .melody-line-row {
        display: flex;
        align-items: flex-end;
        gap: 8px;
        margin-bottom: 6px;
      }

      .melody-line-prefix {
        flex: 0 0 4.2em;
        width: 4.2em;
        text-align: right;
        font-size: 12px;
        font-weight: 300;
        line-height: 2;
        font-variant-numeric: tabular-nums;
        user-select: none;
      }

      .melody-line-content {
        flex: 1 1 auto;
        min-width: 0;
        line-height: 2;
      }

      .card {
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--panel);
        padding: 12px;
      }

      .panel-list {
        margin: 0;
        padding-left: 16px;
        color: var(--text);
        line-height: 1.7;
        font-size: 13px;
      }

      .panel-item-line {
        display: block;
      }

      .panel-match {
        font-weight: 600;
      }

      .panel-mismatch {
        font-weight: 600;
      }

      .title {
        margin-bottom: 8px;
        font-weight: 600;
      }

      .hint {
        margin-top: -2px;
        margin-bottom: 8px;
        color: var(--muted);
        font-size: 12px;
      }

      textarea {
        width: 100%;
        min-height: 190px;
        resize: vertical;
        border: 1px solid #cbd4e2;
        border-radius: 8px;
        padding: 10px;
        line-height: 1.5;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Courier New", monospace;
      }

      .editor {
        width: 100%;
        min-height: 190px;
        border: 1px solid #cbd4e2;
        border-radius: 8px;
        padding: 10px;
        line-height: 1.5;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Courier New", monospace;
        white-space: pre-wrap;
        overflow: auto;
        background: #fff;
      }

      .editor:focus {
        outline: 2px solid #b9ccff;
        outline-offset: 1px;
      }

      .editor.readonly {
        background: #f7f9ff;
      }

      .line {
        margin-bottom: 6px;
      }

      .segment {
        display: inline-block;
        margin-right: 8px;
      }

      .token {
        display: inline-block;
        position: relative;
        margin-right: 2px;
        padding: 0 3px;
        border-radius: 4px;
        transition: background-color 0.12s ease-in;
        border-bottom: 2px solid transparent;
      }

      .token.hover {
        outline: 1px solid #8ab4ff;
        background: #edf4ff;
      }

      .token .small {
        color: #526071;
        font-size: 12px;
      }

      .gap {
        display: inline-block;
        width: 4px;
        min-height: 1em;
      }

      @media (max-width: 1100px) {
        .subhead-row {
          flex-direction: column;
        }
        .status {
          text-align: left;
        }
        .top-actions {
          grid-template-columns: 1fr;
        }
        .content-row {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>歌词字音 & 音乐旋律校对工具</h1>
      <div class="subhead-row">
        <div class="subtitle">上传旋律或直接输入，实时检查每个字与旋律的匹配情况。</div>
        <div id="statusText" class="status"></div>
      </div>

      <div class="top-actions">
        <div class="card action-stack">
          <button class="primary" id="calcBtn">重置编辑</button>
          <button class="secondary" id="sampleBtn">示例</button>
          <label class="secondary" for="midiFileInput" style="display: inline-block; cursor: pointer; width: fit-content"
            >上传 MIDI</label
          >
          <input
            id="midiFileInput"
            type="file"
            accept=".mid,.midi,audio/midi,audio/x-midi"
            style="position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0"
          />
          <label class="label"
            >每句小节数
            <select id="barsPerSentence">
              <option value="1">1</option>
              <option value="2" selected>2</option>
              <option value="3">3</option>
              <option value="4">4</option>
            </select>
          </label>
        </div>
        <div class="grid" style="margin-top: 0">
          <div class="card">
            <div class="title">旋律输入</div>
            <div class="hint">可手输，也可通过 MIDI 上传自动填充。</div>
            <textarea id="melodyInput"></textarea>
          </div>
          <div class="card">
            <div class="title">歌词输入</div>
            <div class="hint">支持多行。分词将由解析逻辑自动处理。</div>
            <div class="toolbar" style="margin-top: 8px">
              <button type="button" class="secondary" id="aiAnnotateBtn">AI分词</button>
            </div>
            <textarea id="lyricsInput"></textarea>
          </div>
        </div>
      </div>

      <div class="content-row">
        <div class="card">
          <div class="title">旋律校验提示</div>
          <div class="hint">将鼠标悬停到结果区的某个字，即可查看该位置的校验结果。</div>
          <ul id="validationPanel" class="panel-list">
            <li>字音：</li>
            <li>左侧：</li>
            <li>右侧：</li>
          </ul>
        </div>
        <div class="card">
          <div class="title">旋律结果</div>
          <div class="hint">只读展示；支持与歌词窗口悬停联动高亮。</div>
          <div id="melodyRenderEditor" class="editor readonly" contenteditable="false" spellcheck="false">
            <div id="melodyRenderInner"></div>
          </div>
        </div>
        <div class="card">
          <div class="title">歌词结果</div>
          <div class="hint">仅允许修改拼音、分词斜线与换行；若改动汉字序列会自动回退。</div>
          <div id="lyricsRenderEditor" class="editor" contenteditable="true" spellcheck="false"></div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tonejs/midi@2.0.28/build/Midi.min.js"></script>

      function setStatus(text, isError) {
        statusText.className = "status " + (isError ? "err" : "ok");
        statusText.textContent = text;
      }

      function extractAnnotateResult(payload) {
        if (!payload || typeof payload !== "object") return null;
        const inner = payload.data;
        if (inner && typeof inner === "object" && "result" in inner) return inner.result;
        return null;
      }

      async function requestAiLyricsAnnotate() {
        const text = String(lyricsInput.value || "").trim();
        if (!text) {
          setStatus("请先填写歌词输入。", true);
          return;
        }
        aiAnnotateBtn.disabled = true;
        setStatus("AI分词请求中…", false);
        try {
          const resp = await fetch(LYRICS_ANNOTATE_API_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text }),
          });
          let payload = null;
          try {
            payload = await resp.json();
          } catch (_e) {
            payload = null;
          }
          if (!resp.ok) {
            const msg =
              (payload && (payload.message || payload.msg || payload.error)) || resp.statusText || "请求失败";
            throw new Error(String(msg));
          }
          const raw = extractAnnotateResult(payload);
          if (raw === null || raw === undefined) {
            throw new Error("响应中缺少 data.result");
          }
          let out = raw;
          if (typeof out !== "string") {
            if (typeof out === "number" && Number.isFinite(out)) out = String(out);
            else throw new Error("data.result 应为字符串");
          }
          lyricsInput.value = out;
          scheduleAutoCalc();
          setStatus("AI分词已写入歌词输入。", false);
        } catch (err) {
          setStatus("AI分词失败：" + (err && err.message ? err.message : String(err)), true);
        } finally {
          aiAnnotateBtn.disabled = false;
        }
      }

      function getDeviationColorClass(deviations) {
        const cfg = window.IntervalConfig && window.IntervalConfig.DEVIATION_HIGHLIGHT;
        if (!cfg || !Array.isArray(deviations)) return null;
        const nums = deviations.map((n) => Number(n)).filter((n) => Number.isFinite(n));
        if (nums.length === 0) return null;
        // New rule: fail only when all elements are non-zero.
        if (!nums.every((n) => n !== 0)) return null;
        const absValues = nums.map((n) => Math.abs(n));
        const maxAbs = Math.max.apply(null, absValues);
        if (maxAbs <= Number(cfg.lowMax || 2)) return cfg.colors.low;
        return cfg.colors.high;
      }

      function getInvalidUnderlineColor() {
        return (window.IntervalConfig && window.IntervalConfig.SINGLE_CHAR_UNDERLINE_COLOR) || "#5b21b6";
      }

      function isDeviationFailed(deviations) {
        const nums = Array.isArray(deviations) ? deviations.map((n) => Number(n)).filter((n) => Number.isFinite(n)) : [];
        if (nums.length === 0) return false;
        return nums.every((n) => n !== 0);
      }

      function getMatchTextColor() {
        const cfg = window.IntervalConfig && window.IntervalConfig.DEVIATION_HIGHLIGHT;
        return (cfg && cfg.colors && cfg.colors.zero) || "#8fd19e";
      }

      function getMismatchTextColor() {
        const cfg = window.IntervalConfig && window.IntervalConfig.DEVIATION_HIGHLIGHT;
        return (cfg && cfg.colors && cfg.colors.high) || "#ff6b6b";
      }

      function getToneRange(prevTone, nextTone) {
        const cfg = window.IntervalConfig && window.IntervalConfig.TONE_INTERVAL_RANGES;
        if (!cfg) return null;
        const key = String(Number(prevTone) || 0) + String(Number(nextTone) || 0);
        return Array.isArray(cfg[key]) && cfg[key].length === 2 ? cfg[key] : null;
      }

      function formatSemitoneRange(range) {
        if (!Array.isArray(range) || range.length !== 2) return "无建议区间";
        const a = Number(range[0]);
        const b = Number(range[1]);
        const low = Math.min(a, b);
        const high = Math.max(a, b);
        if (low === -30 && high === 30) return "任意半音";
        if (low === -30) return high + " 个半音及以下";
        if (high === 30) return low + " 个半音及以上";
        return low + " ~ " + high + " 个半音";
      }

      function buildIntervalPairs(nextNotes, prevNotes) {
        const next = Array.isArray(nextNotes) ? nextNotes : [];
        const prev = Array.isArray(prevNotes) ? prevNotes : [];
        const pairs = [];
        next.forEach((n2) => {
          prev.forEach((n1) => {
            pairs.push(String(n2) + " ~ " + String(n1));
          });
        });
        return pairs;
      }

      function formatActualIntervals(intervals, pairs) {
        const arr = Array.isArray(intervals) ? intervals : [];
        if (!arr.length) return "无";
        const valueText = arr.join("或");
        const pairArr = Array.isArray(pairs) ? pairs.filter(Boolean) : [];
        if (!pairArr.length) return valueText;
        return valueText + "（" + pairArr.join(" / ") + "）";
      }

      function setValidationPanelContent(lines) {
        const list = Array.isArray(lines) && lines.length ? lines : [];
        validationPanel.innerHTML = "";
        list.forEach((line) => {
          const li = document.createElement("li");
          if (line && typeof line === "object" && !Array.isArray(line)) {
            const header = document.createElement("span");
            header.className = "panel-item-line";
            header.textContent = String(line.title || "");
            if (line.status) {
              const status = document.createElement("span");
              status.textContent = String(line.status);
              if (line.status === "匹配") {
                status.classList.add("panel-match");
                status.style.color = getMatchTextColor();
              } else if (line.status === "不匹配") {
                status.classList.add("panel-mismatch");
                status.style.color = getMismatchTextColor();
              }
              header.appendChild(status);
            }
            li.appendChild(header);

            const details = Array.isArray(line.details) ? line.details : [];
            details.forEach((d) => {
              const detail = document.createElement("span");
              detail.className = "panel-item-line";
              detail.textContent = String(d || "");
              li.appendChild(detail);
            });
          } else {
            const segs = Array.isArray(line) ? line : [line];
            segs.forEach((seg) => {
              const span = document.createElement("span");
              span.className = "panel-item-line";
              span.textContent = String(seg || "");
              li.appendChild(span);
            });
          }
          validationPanel.appendChild(li);
        });
      }

      function resetValidationPanel() {
        setValidationPanelContent([{ title: "字音：" }, { title: "左侧：" }, { title: "右侧：" }]);
      }

      function escapeHtml(text) {
        return String(text || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function normalizeEditorText(text) {
        return String(text || "")
          .replace(/\u00a0/g, " ")
          .replace(/\u200b/g, "")
          .replace(/\r\n/g, "\n")
          .trim();
      }

      function compactSlashSpacing(text) {
        return String(text || "").replace(/\s*\/\s*/g, "/");
      }

      function toComputeLyricsFormat(text) {
        const src = String(text || "");
        return src.replace(/([\u4e00-\u9fa5])\s*([a-zA-ZvV\u00fc\u00dc]+[0-4]?)/g, function (_m, ch, py) {
          return ch + "(" + py + ")";
        });
      }

      function parseDemoCaseMarkdown(mdText) {
        const text = String(mdText || "");
        const titleMatch = text.match(/^#\s+(.+)$/m);
        const lyricsMatch = text.match(/##\s*歌词[\s\S]*?```(?:text)?\s*([\s\S]*?)```/i);
        const melodyMatch = text.match(/##\s*旋律[\s\S]*?```(?:text)?\s*([\s\S]*?)```/i);
        return {
          title: titleMatch ? titleMatch[1].trim() : "示例",
          lyrics: lyricsMatch ? lyricsMatch[1].trim() : "",
          melody: melodyMatch ? melodyMatch[1].trim() : "",
        };
      }

      async function loadDemoCase(casePath, fallbackCase) {
        let parsed = null;
        let usedFallback = false;
        try {
          const resp = await fetch(casePath);
          if (!resp.ok) throw new Error("读取示例失败：" + casePath);
          const md = await resp.text();
          parsed = parseDemoCaseMarkdown(md);
          if (!parsed.lyrics || !parsed.melody) {
            throw new Error("示例格式错误，需包含“歌词/旋律”代码块。");
          }
        } catch (_err) {
          parsed = fallbackCase || null;
          usedFallback = true;
        }

        if (!parsed || !parsed.lyrics || !parsed.melody) {
          throw new Error("加载示例失败：无可用示例数据。");
        }

        lyricsInput.value = parsed.lyrics;
        melodyInput.value = parsed.melody;
        calcFromRawInputs();
        setStatus((usedFallback ? "已加载内置示例：" : "已加载示例：") + parsed.title, false);
      }

      function nextDemoCase() {
        demoCaseIndex = (demoCaseIndex + 1) % DEMO_CASE_FILES.length;
        loadDemoCase(DEMO_CASE_FILES[demoCaseIndex], DEMO_CASE_FALLBACK[demoCaseIndex]).catch((err) => {
          setStatus("加载示例失败：" + (err && err.message ? err.message : String(err)), true);
        });
      }

      function getExpectedHanSequence() {
        const arr = Array.isArray(currentSingleCharArray) ? currentSingleCharArray : [];
        let chars = "";
        arr.forEach((line) => {
          (Array.isArray(line) ? line : []).forEach((segment) => {
            (Array.isArray(segment) ? segment : []).forEach((item) => {
              chars += String((item && item[0]) || "");
            });
          });
        });
        return chars;
      }

      function getHanSequenceFromRenderText(text) {
        const matched = String(text || "").match(/[\u4e00-\u9fa5]/g);
        return matched ? matched.join("") : "";
      }

      function setLyricsEditorText(text) {
        lyricsRenderEditor.textContent = compactSlashSpacing(String(text || ""));
      }

      function getLyricsEditorText() {
        const raw = normalizeEditorText(lyricsRenderEditor.innerText || lyricsRenderEditor.textContent || "");
        return toComputeLyricsFormat(raw);
      }

      function setMelodyEditorText(text) {
        if (melodyRenderInner) {
          melodyRenderInner.textContent = compactSlashSpacing(String(text || ""));
        } else {
          melodyRenderEditor.textContent = compactSlashSpacing(String(text || ""));
        }
      }

      function getMelodyEditorText() {
        const src = melodyRenderInner
          ? melodyRenderInner.innerText || melodyRenderInner.textContent || ""
          : melodyRenderEditor.innerText || melodyRenderEditor.textContent || "";
        return normalizeEditorText(src);
      }

      function countCharsInLine(line) {
        let n = 0;
        (Array.isArray(line) ? line : []).forEach((segment) => {
          n += (Array.isArray(segment) ? segment : []).length;
        });
        return n;
      }

      function getPrevItemInLine(line, segIdx, itemIdx) {
        const segs = Array.isArray(line) ? line : [];
        if (itemIdx > 0) {
          const seg = Array.isArray(segs[segIdx]) ? segs[segIdx] : [];
          return seg[itemIdx - 1] || null;
        }
        for (let s = segIdx - 1; s >= 0; s -= 1) {
          const seg = Array.isArray(segs[s]) ? segs[s] : [];
          if (seg.length > 0) return seg[seg.length - 1];
        }
        return null;
      }

      function getNextItemInLine(line, segIdx, itemIdx) {
        const segs = Array.isArray(line) ? line : [];
        const seg = Array.isArray(segs[segIdx]) ? segs[segIdx] : [];
        if (itemIdx < seg.length - 1) return seg[itemIdx + 1] || null;
        for (let s = segIdx + 1; s < segs.length; s += 1) {
          const nextSeg = Array.isArray(segs[s]) ? segs[s] : [];
          if (nextSeg.length > 0) return nextSeg[0];
        }
        return null;
      }

      function linePenalty(line) {
        let penalty = 0;
        const segs = Array.isArray(line) ? line : [];
        segs.forEach((segment, segIdx) => {
          const seg = Array.isArray(segment) ? segment : [];
          seg.forEach((item, itemIdx) => {
            const singleValid = Number(item[4]) === 1;
            if (!singleValid) penalty += 1;
            const leftDeviations = item[5] && Array.isArray(item[5][1]) ? item[5][1] : [];
            if (getPrevItemInLine(line, segIdx, itemIdx) && isDeviationFailed(leftDeviations)) penalty += 0.5;
            const rightDeviations = item[6] && Array.isArray(item[6][1]) ? item[6][1] : [];
            if (getNextItemInLine(line, segIdx, itemIdx) && isDeviationFailed(rightDeviations)) penalty += 0.5;
          });
        });
        return penalty;
      }

      function computeLineMatchPercent(line) {
        const total = countCharsInLine(line);
        if (total <= 0) return null;
        const penalty = linePenalty(line);
        const ratio = Math.min(penalty / total, 1);
        return (1 - ratio) * 100;
      }

      function renderPreview() {
        const lines = Array.isArray(currentSingleCharArray) ? currentSingleCharArray : [];
        lyricsRenderEditor.innerHTML = "";
        if (melodyRenderInner) {
          melodyRenderInner.innerHTML = "";
        } else {
          melodyRenderEditor.innerHTML = "";
        }
        hoverInfoMap = {};

        lines.forEach((line, li) => {
          const lyricLine = document.createElement("div");
          lyricLine.className = "line";
          const melodyRow = document.createElement("div");
          melodyRow.className = "melody-line-row";

          const melodyPrefix = document.createElement("div");
          melodyPrefix.className = "melody-line-prefix";
          const passColor = getMatchTextColor();
          melodyPrefix.style.color = passColor;
          const pct = computeLineMatchPercent(line);
          if (pct === null) melodyPrefix.textContent = "—";
          else {
            const rounded = Math.round(pct * 10) / 10;
            melodyPrefix.textContent = rounded + "%";
          }

          const melodyContent = document.createElement("div");
          melodyContent.className = "melody-line-content";

          (Array.isArray(line) ? line : []).forEach((segment, si) => {
            const lyricSeg = document.createElement("span");
            lyricSeg.className = "segment";
            const melodySeg = document.createElement("span");
            melodySeg.className = "segment";

            (Array.isArray(segment) ? segment : []).forEach((item, ii) => {
              const key = li + "-" + si + "-" + ii;
              const char = item[0] || "";
              const py = item[1] || "";
              const tone = Number(item[2]) || 0;
              const notes = Array.isArray(item[3]) ? item[3] : [];
              const singleValid = Number(item[4]) === 1;
              const leftDeviations = item[5] && Array.isArray(item[5][1]) ? item[5][1] : [];
              const leftIntervals = item[5] && Array.isArray(item[5][0]) ? item[5][0] : [];
              const rightDeviations = item[6] && Array.isArray(item[6][1]) ? item[6][1] : [];
              const rightIntervals = item[6] && Array.isArray(item[6][0]) ? item[6][0] : [];

              const leftColor = getDeviationColorClass(leftDeviations);
              const rightColor = getDeviationColorClass(rightDeviations);

              const lyricToken = document.createElement("span");
              lyricToken.className = "token" + (singleValid ? "" : " invalid");
              lyricToken.dataset.key = key;
              lyricToken.innerHTML = escapeHtml(char) + '<span class="small">' + escapeHtml(py + tone) + "</span>";
              if (!singleValid) lyricToken.style.borderBottomColor = getInvalidUnderlineColor();

              if (leftColor || rightColor) {
                const bg = "linear-gradient(to right, " +
                  (leftColor ? leftColor + "55" : "transparent") +
                  " 0%, " +
                  (leftColor ? leftColor + "55" : "transparent") +
                  " 50%, " +
                  (rightColor ? rightColor + "55" : "transparent") +
                  " 50%, " +
                  (rightColor ? rightColor + "55" : "transparent") +
                  " 100%)";
                lyricToken.style.backgroundImage = bg;
              }

              const melodyToken = document.createElement("span");
              melodyToken.className = "token" + (singleValid ? "" : " invalid");
              melodyToken.dataset.key = key;
              melodyToken.textContent = notes.join("-");
              if (!singleValid) melodyToken.style.borderBottomColor = getInvalidUnderlineColor();

              if (leftColor || rightColor) {
                const bg = "linear-gradient(to right, " +
                  (leftColor ? leftColor + "55" : "transparent") +
                  " 0%, " +
                  (leftColor ? leftColor + "55" : "transparent") +
                  " 50%, " +
                  (rightColor ? rightColor + "55" : "transparent") +
                  " 50%, " +
                  (rightColor ? rightColor + "55" : "transparent") +
                  " 100%)";
                melodyToken.style.backgroundImage = bg;
              }

              lyricSeg.appendChild(lyricToken);
              melodySeg.appendChild(melodyToken);

              const segArr = Array.isArray(segment) ? segment : [];
              const leftItem = ii > 0 ? segArr[ii - 1] : null;
              const rightItem = ii < segArr.length - 1 ? segArr[ii + 1] : null;
              hoverInfoMap[key] = {
                char,
                tone,
                notes,
                singleValid,
                left: {
                  char: leftItem ? leftItem[0] || "" : "",
                  tone: leftItem ? Number(leftItem[2]) || 0 : 0,
                  notes: leftItem && Array.isArray(leftItem[3]) ? leftItem[3] : [],
                  range: leftItem ? getToneRange(Number(leftItem[2]) || 0, tone) : null,
                  intervals: leftIntervals,
                  deviations: leftDeviations,
                },
                right: {
                  char: rightItem ? rightItem[0] || "" : "",
                  tone: rightItem ? Number(rightItem[2]) || 0 : 0,
                  notes: rightItem && Array.isArray(rightItem[3]) ? rightItem[3] : [],
                  range: rightItem ? getToneRange(tone, Number(rightItem[2]) || 0) : null,
                  intervals: rightIntervals,
                  deviations: rightDeviations,
                },
              };

              if (ii < segArr.length - 1) {
                const lyricGap = document.createElement("span");
                lyricGap.className = "gap";
                lyricGap.textContent = "\u200b";
                lyricSeg.appendChild(lyricGap);

                const melodyGap = document.createElement("span");
                melodyGap.className = "gap";
                melodyGap.textContent = "\u200b";
                melodySeg.appendChild(melodyGap);
              }
            });

            if (si < (Array.isArray(line) ? line.length : 0) - 1) {
              const lyricSep = document.createElement("span");
              lyricSep.className = "token";
              lyricSep.textContent = "/";
              lyricSeg.appendChild(lyricSep);

              const melodySep = document.createElement("span");
              melodySep.className = "token";
              melodySep.textContent = "/";
              melodySeg.appendChild(melodySep);
            }

            lyricLine.appendChild(lyricSeg);
            melodyContent.appendChild(melodySeg);
          });

          lyricsRenderEditor.appendChild(lyricLine);
          melodyRow.appendChild(melodyPrefix);
          melodyRow.appendChild(melodyContent);
          if (melodyRenderInner) {
            melodyRenderInner.appendChild(melodyRow);
          } else {
            melodyRenderEditor.appendChild(melodyRow);
          }
        });
      }

      function bindHoverSync() {
        function clearHover() {
          document.querySelectorAll(".token.hover").forEach((n) => n.classList.remove("hover"));
        }

        function renderHoverValidation(key) {
          const info = hoverInfoMap[key];
          if (!info) {
            resetValidationPanel();
            return;
          }
          const toneText = String(info.tone || 0);
          const noteText = (Array.isArray(info.notes) ? info.notes : []).join("-") || "无";
          const singleLine =
            Number(info.singleValid) === 1
              ? { title: "字音：", status: "匹配", details: [] }
              : {
                  title: "字音：",
                  status: "不匹配",
                  details: ["“" + toneText + "”音调与“" + noteText + "”旋律反方向"],
                };

          let leftLine = { title: "左侧：", status: "匹配", details: [] };
          if (info.left && info.left.char) {
            const ab = String(info.left.tone || 0) + "、" + String(info.tone || 0);
            const leftMismatch = isDeviationFailed(info.left.deviations);
            leftLine = {
              title: "左侧：",
              status: leftMismatch ? "不匹配" : "匹配",
              details: [
                "“" + info.left.char + info.char + "” 声调：“" + ab + "”",
                "建议音程：" + formatSemitoneRange(info.left.range),
                "现为：" + formatActualIntervals(info.left.intervals, buildIntervalPairs(info.notes, info.left.notes)),
              ],
            };
          }

          let rightLine = { title: "右侧：", status: "匹配", details: [] };
          if (info.right && info.right.char) {
            const ab = String(info.tone || 0) + "、" + String(info.right.tone || 0);
            const rightMismatch = isDeviationFailed(info.right.deviations);
            rightLine = {
              title: "右侧：",
              status: rightMismatch ? "不匹配" : "匹配",
              details: [
                "“" + info.char + info.right.char + "” 声调：“" + ab + "”",
                "建议音程：" + formatSemitoneRange(info.right.range),
                "现为：" + formatActualIntervals(info.right.intervals, buildIntervalPairs(info.right.notes, info.notes)),
              ],
            };
          }

          setValidationPanelContent([singleLine, leftLine, rightLine]);
        }

        function onEnter(ev) {
          const target = ev.target && ev.target.closest ? ev.target.closest(".token") : null;
          if (!target) return;
          const key = target.dataset.key;
          if (pinnedValidationKey) return;
          clearHover();
          document.querySelectorAll('.token[data-key="' + key + '"]').forEach((n) => n.classList.add("hover"));
          renderHoverValidation(key);
        }

        function onClick(ev) {
          if (pinnedValidationKey) {
            pinnedValidationKey = null;
            clearHover();
            resetValidationPanel();
            return;
          }
          const target = ev.target && ev.target.closest ? ev.target.closest(".token") : null;
          if (!target) return;
          const key = target.dataset.key;
          pinnedValidationKey = key;
          clearHover();
          document.querySelectorAll('.token[data-key="' + key + '"]').forEach((n) => n.classList.add("hover"));
          renderHoverValidation(key);
        }

        function onLeave() {
          if (pinnedValidationKey) return;
          clearHover();
          resetValidationPanel();
        }

        lyricsRenderEditor.addEventListener("mouseover", onEnter);
        melodyRenderEditor.addEventListener("mouseover", onEnter);
        lyricsRenderEditor.addEventListener("click", onClick);
        melodyRenderEditor.addEventListener("click", onClick);
        lyricsRenderEditor.addEventListener("mouseleave", onLeave);
        melodyRenderEditor.addEventListener("mouseleave", onLeave);
      }

      function renderBySingleCharArray(arr) {
        currentSingleCharArray = Array.isArray(arr) ? arr : [];
        pinnedValidationKey = null;
        resetValidationPanel();
        lastValidLyricsRenderText = window.Json2Window.singleCharToRenderLyrics(currentSingleCharArray);
        setLyricsEditorText(lastValidLyricsRenderText);
        lastValidMelodyRenderText = window.Json2Window.singleCharToRenderMelody(currentSingleCharArray);
        setMelodyEditorText(lastValidMelodyRenderText);
        renderPreview();
      }

      function calcFromRawInputs() {
        try {
          const arr = window.Compute.buildSingleCharIntervalArrayFromText(lyricsInput.value, melodyInput.value);
          renderBySingleCharArray(arr);
          setStatus("计算成功（原始输入链路）。", false);
        } catch (err) {
          setStatus("计算失败：" + (err && err.message ? err.message : String(err)), true);
        }
      }

      function applyFromRenderPanels() {
        try {
          const lyricsRenderText = getLyricsEditorText();
          // Requirement: melody source for re-compute should come from input panel,
          // not from read-only melody render panel.
          const melodyRenderText = normalizeEditorText(melodyInput.value || "");
          const arr = window.Compute.buildSingleCharIntervalArrayFromRenderText(lyricsRenderText, melodyRenderText);
          currentSingleCharArray = arr;
          lastValidLyricsRenderText = lyricsRenderText;
          lastValidMelodyRenderText = melodyRenderText;
          lyricsInput.value = window.Json2Window.singleCharToParsedLyrics(arr);
          melodyInput.value = window.Json2Window.singleCharToParsedMelody(arr);
          renderPreview();
          setStatus("应用渲染成功（渲染链路回算）。", false);
        } catch (err) {
          setStatus("应用渲染失败：" + (err && err.message ? err.message : String(err)), true);
        }
      }

      async function parseMidiToMelodyInput() {
        const file = midiFileInput.files && midiFileInput.files[0];
        if (!file) {
          setStatus("请先选择 MIDI 文件。", true);
          return;
        }
        try {
          const buf = await file.arrayBuffer();
          currentParsedMidi = window.MidiParser.parseMidiArrayBuffer(buf);
          currentTemplateNotes = window.MidiParser.flattenNotes(currentParsedMidi);
          currentTimingInfo = window.MidiParser.getTimingInfo(currentParsedMidi);

          melodyInput.value = window.MidiParser.notesToSentenceText(currentTemplateNotes, {
            bpm: currentTimingInfo.bpm,
            beatsPerBar: currentTimingInfo.beatsPerBar,
            barsPerSentence: Number(barsPerSentenceSelect.value),
            offsetFraction: 0,
          });
          scheduleAutoApply();

          setStatus(
            "MIDI 解析成功：" +
              file.name +
              "，音符 " +
              currentTemplateNotes.length +
              "，拍号 " +
              currentTimingInfo.numerator +
              "/" +
              currentTimingInfo.denominator,
            false
          );
        } catch (err) {
          setStatus("MIDI 解析失败：" + (err && err.message ? err.message : String(err)), true);
        }
      }

      function regroupMidiToMelodyInput() {
        try {
          if (!Array.isArray(currentTemplateNotes) || currentTemplateNotes.length === 0) {
            setStatus("请先解析 MIDI 文件。", true);
            return;
          }
          melodyInput.value = window.MidiParser.notesToSentenceText(currentTemplateNotes, {
            bpm: currentTimingInfo.bpm,
            beatsPerBar: currentTimingInfo.beatsPerBar,
            barsPerSentence: Number(barsPerSentenceSelect.value),
            offsetFraction: 0,
          });
          scheduleAutoApply();
          setStatus("已按当前每句小节数重新分句。", false);
        } catch (err) {
          setStatus("重新分句失败：" + (err && err.message ? err.message : String(err)), true);
        }
      }

      function init() {
        bindHoverSync();
        resetValidationPanel();
        nextDemoCase();
      }

      function onLyricsEditorInput() {
        const candidate = getLyricsEditorText();
        const expected = getExpectedHanSequence();
        const got = getHanSequenceFromRenderText(candidate);
        if (expected !== got) {
          lastValidLyricsRenderText = window.Json2Window.singleCharToRenderLyrics(currentSingleCharArray);
          renderPreview();
          setStatus("仅可编辑拼音、斜线和换行；不允许增删或改动汉字。", true);
          return;
        }
        lastValidLyricsRenderText = candidate;
        scheduleAutoApply();
      }

      function scheduleAutoCalc() {
        if (autoCalcTimer) clearTimeout(autoCalcTimer);
        autoCalcTimer = setTimeout(function () {
          calcFromRawInputs();
        }, 180);
      }

      function scheduleAutoApply() {
        if (autoApplyTimer) clearTimeout(autoApplyTimer);
        autoApplyTimer = setTimeout(function () {
          applyFromRenderPanels();
        }, 180);
      }

      lyricsInput.addEventListener("input", function () {
        scheduleAutoCalc();
      });
      melodyInput.addEventListener("blur", function () {
        scheduleAutoApply();
      });

      calcBtn.addEventListener("click", calcFromRawInputs);
      sampleBtn.addEventListener("click", nextDemoCase);
      aiAnnotateBtn.addEventListener("click", function () {
        requestAiLyricsAnnotate();
      });
      midiFileInput.addEventListener("change", function () {
        if (!midiFileInput.files || !midiFileInput.files[0]) return;
        if (
          melodyInput.value &&
          !window.confirm("上传 MIDI 后将覆盖当前旋律输入，是否继续？")
        ) {
          midiFileInput.value = "";
          return;
        }
        parseMidiToMelodyInput();
      });
      barsPerSentenceSelect.addEventListener("change", regroupMidiToMelodyInput);
      lyricsRenderEditor.addEventListener("input", onLyricsEditorInput);

      init();
    </script>
  </body>
</html>
