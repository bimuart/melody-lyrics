<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>音程差值计算</title>
    <style>
      body {
        margin: 0;
        padding: 24px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei",
          sans-serif;
        background: #f7f8fa;
        color: #1f2329;
      }
      .container {
        max-width: 760px;
        margin: 0 auto;
      }
      .card {
        background: #fff;
        border: 1px solid #d9dde3;
        border-radius: 10px;
        padding: 14px;
      }
      .row {
        display: flex;
        gap: 10px;
        align-items: center;
        margin: 10px 0;
        flex-wrap: wrap;
      }
      input {
        height: 34px;
        border: 1px solid #ccd5df;
        border-radius: 8px;
        padding: 0 10px;
        font-size: 14px;
        width: 120px;
      }
      button {
        border: none;
        border-radius: 8px;
        padding: 9px 12px;
        background: #1677ff;
        color: #fff;
        cursor: pointer;
      }
      pre {
        background: #0f1720;
        color: #d6e4f7;
        border-radius: 8px;
        padding: 10px;
        margin: 10px 0 0;
      }
      .hint {
        color: #5c616b;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>音程差值（半音）计算</h2>
      <div class="card">
        <div class="row">
          <label for="note1">音名1</label>
          <input id="note1" value="E3" />
          <label for="note2">音名2</label>
          <input id="note2" value="D3" />
          <button id="calcBtn">计算</button>
        </div>
        <div class="hint">计算规则：结果 = 音名1 - 音名2（按 MIDI 半音编号相减）</div>
        <pre id="output"></pre>
      </div>
    </div>

    <script src="../core-js/compute.js"></script>
    <script>
      const note1 = document.getElementById("note1");
      const note2 = document.getElementById("note2");
      const calcBtn = document.getElementById("calcBtn");
      const output = document.getElementById("output");

      function render() {
        try {
          const input = [note1.value, note2.value];
          const result = window.Compute.calcSemitoneDiff(input);
          output.textContent = JSON.stringify(
            {
              input,
              result,
            },
            null,
            2
          );
        } catch (err) {
          output.textContent = String(err && err.message ? err.message : err);
        }
      }

      calcBtn.addEventListener("click", render);
      render();
    </script>
  </body>
  </html>
