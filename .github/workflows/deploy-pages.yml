name: Deploy to GitHub Pages

on:
  push:
    branches: ["deploy"]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_LYRICS_ANNOTATE_URL: ${{ vars.VITE_LYRICS_ANNOTATE_URL }}
      VITE_LYRICS_ANNOTATE_STREAM_URL: ${{ vars.VITE_LYRICS_ANNOTATE_STREAM_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: melody-check-web/package-lock.json

      - name: Install deps
        run: npm ci
        working-directory: melody-check-web

      - name: Build
        run: npm run build
        working-directory: melody-check-web

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: melody-check-web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
